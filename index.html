<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My To-Do List</h1>
        </header>
        <main>
            <section class="input-area">
                <input type="text" id="task-input" placeholder="What needs to be done?">
                <select id="priority-input">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
                <button id="add-task-btn">Add Task</button>
            </section>
            <section class="task-list-area">
                <h2>Tasks</h2>
                <ul id="task-list">
                    <!-- Tasks will be dynamically added here by JavaScript -->
                    <!-- Example of a task item structure (for reference):
                    <li class="task-item priority-medium">
                        <input type="checkbox" class="task-complete-checkbox">
                        <span class="task-text">Example task</span>
                        <span class="task-priority-indicator">Medium</span>
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn">Delete</button>
                    </li>
                    -->
                </ul>
            </section>
        </main>
        <footer>
            <p>&copy; 2024 To-Do App</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
